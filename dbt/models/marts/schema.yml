version: 2

models:
  - name: dbt_smoke_test
    description: "Smoke-test model confirming dbt can materialize a table in Postgres."
    columns:
      - name: database_name
        tests:
          - not_null
      - name: schema_name
        tests:
          - not_null
      - name: checked_at
        tests:
          - not_null
