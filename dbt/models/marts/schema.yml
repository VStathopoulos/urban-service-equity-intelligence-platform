version: 2

models:
  - name: dbt_smoke_test
    description: "Smoke-test model confirming dbt can materialize a table in Postgres."
    columns:
      - name: database_name
        tests:
          - not_null
      - name: schema_name
        tests:
          - not_null
      - name: checked_at
        tests:
          - not_null

  - name: fact_service_requests
    description: "BI-facing fact table for cross-city service request analysis across NYC 311 and Barcelona IRIS."
    columns:
      - name: service_request_key
        description: "Unique cross-city request key composed from source system and request ID."
        tests:
          - not_null
          - unique

      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['nyc_311', 'barcelona_iris']

      - name: source_city
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NYC', 'Barcelona']

      - name: source_country
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USA', 'Spain']

      - name: request_id
        tests:
          - not_null

      - name: created_at
        tests:
          - not_null

      - name: created_date
        tests:
          - not_null

      - name: created_month
        tests:
          - not_null

      - name: service_category_original
        tests:
          - not_null

      - name: service_category_standardized
        tests:
          - not_null

      - name: is_category_mapped
        tests:
          - not_null

      - name: has_area
        tests:
          - not_null

      - name: area_name
        tests:
          - not_null

      - name: has_geo
        tests:
          - not_null

      - name: resolution_time_bucket
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'No closed timestamp'
                  - '< 24 hours'
                  - '24–72 hours'
                  - '3–7 days'
                  - '7+ days'

      - name: sla_72h_proxy_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Breached 72h proxy'
                  - 'Within 72h proxy'
                  - 'Not closed / unknown'

  - name: mart_city_comparison
    description: "City-level KPI mart comparing request volume, backlog, geocoding, mapping coverage, and resolution-time proxy metrics."
    columns:
      - name: source_city
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['NYC', 'Barcelona']

      - name: source_country
        tests:
          - not_null

      - name: source_system
        tests:
          - not_null

      - name: total_requests
        tests:
          - not_null

      - name: closed_requests
        tests:
          - not_null

      - name: open_requests
        tests:
          - not_null

      - name: open_backlog_rate_pct
        tests:
          - not_null

      - name: geocoded_rate_pct
        tests:
          - not_null

      - name: category_mapping_rate_pct
        tests:
          - not_null

  - name: mart_category_performance
    description: "Category-level KPI mart comparing standardized service categories across cities."
    columns:
      - name: source_city
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NYC', 'Barcelona']

      - name: source_country
        tests:
          - not_null

      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['nyc_311', 'barcelona_iris']

      - name: service_category_standardized
        tests:
          - not_null

      - name: total_requests
        tests:
          - not_null

      - name: closed_requests
        tests:
          - not_null

      - name: open_requests
        tests:
          - not_null

      - name: pct_of_city_requests
        tests:
          - not_null

      - name: geocoded_rate_pct
        tests:
          - not_null

  - name: mart_area_equity
    description: "Area-level equity mart comparing request volume, backlog, geocoding coverage, and resolution-time proxy metrics by city area."
    columns:
      - name: source_city
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NYC', 'Barcelona']

      - name: source_country
        tests:
          - not_null

      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['nyc_311', 'barcelona_iris']

      - name: area_name
        tests:
          - not_null

      - name: has_area
        tests:
          - not_null

      - name: total_requests
        tests:
          - not_null

      - name: closed_requests
        tests:
          - not_null

      - name: open_requests
        tests:
          - not_null

      - name: open_backlog_rate_pct
        tests:
          - not_null

      - name: geocoded_rate_pct
        tests:
          - not_null

  - name: mart_request_map_points
    description: "Request-level geospatial mart for Superset maps, filtered to records with valid latitude and longitude."
    columns:
      - name: map_point_id
        tests:
          - not_null
          - unique

      - name: service_request_key
        tests:
          - not_null
          - unique

      - name: source_city
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NYC', 'Barcelona']

      - name: source_country
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USA', 'Spain']

      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['nyc_311', 'barcelona_iris']

      - name: request_id
        tests:
          - not_null

      - name: created_at
        tests:
          - not_null

      - name: service_category_standardized
        tests:
          - not_null

      - name: area_name
        tests:
          - not_null

      - name: latitude
        tests:
          - not_null

      - name: longitude
        tests:
          - not_null

      - name: has_geo
        tests:
          - not_null

      - name: resolution_time_bucket
        tests:
          - not_null

      - name: sla_72h_proxy_status
        tests:
          - not_null
