version: 2

models:
  - name: dbt_smoke_test
    description: "Smoke-test model confirming dbt can materialize a table in Postgres."
    columns:
      - name: database_name
        tests:
          - not_null
      - name: schema_name
        tests:
          - not_null
      - name: checked_at
        tests:
          - not_null

  - name: fact_service_requests
    description: "BI-facing fact table for cross-city service request analysis across NYC 311 and Barcelona IRIS."
    columns:
      - name: service_request_key
        description: "Unique cross-city request key composed from source system and request ID."
        tests:
          - not_null
          - unique

      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['nyc_311', 'barcelona_iris']

      - name: source_city
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NYC', 'Barcelona']

      - name: source_country
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USA', 'Spain']

      - name: request_id
        tests:
          - not_null

      - name: created_at
        tests:
          - not_null

      - name: created_date
        tests:
          - not_null

      - name: created_month
        tests:
          - not_null

      - name: service_category_original
        tests:
          - not_null

      - name: service_category_standardized
        tests:
          - not_null

      - name: is_category_mapped
        tests:
          - not_null

      - name: has_area
        tests:
          - not_null

      - name: area_name
        tests:
          - not_null

      - name: has_geo
        tests:
          - not_null

      - name: resolution_time_bucket
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'No closed timestamp'
                  - '< 24 hours'
                  - '24–72 hours'
                  - '3–7 days'
                  - '7+ days'

      - name: sla_72h_proxy_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Breached 72h proxy'
                  - 'Within 72h proxy'
                  - 'Not closed / unknown'

  - name: mart_city_comparison
    description: "City-level KPI mart comparing request volume, backlog, geocoding, mapping coverage, and resolution-time proxy metrics."
    columns:
      - name: source_city
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['NYC', 'Barcelona']

      - name: source_country
        tests:
          - not_null

      - name: source_system
        tests:
          - not_null

      - name: total_requests
        tests:
          - not_null

      - name: closed_requests
        tests:
          - not_null

      - name: open_requests
        tests:
          - not_null

      - name: open_backlog_rate_pct
        tests:
          - not_null

      - name: geocoded_rate_pct
        tests:
          - not_null

      - name: category_mapping_rate_pct
        tests:
          - not_null

  - name: mart_category_performance
    description: "Category-level KPI mart comparing standardized service categories across cities."
    columns:
      - name: source_city
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NYC', 'Barcelona']

      - name: source_country
        tests:
          - not_null

      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['nyc_311', 'barcelona_iris']

      - name: service_category_standardized
        tests:
          - not_null

      - name: total_requests
        tests:
          - not_null

      - name: closed_requests
        tests:
          - not_null

      - name: open_requests
        tests:
          - not_null

      - name: pct_of_city_requests
        tests:
          - not_null

      - name: geocoded_rate_pct
        tests:
          - not_null

  - name: mart_area_equity
    description: "Area-level equity mart comparing request volume, backlog, geocoding coverage, and resolution-time proxy metrics by city area."
    columns:
      - name: source_city
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NYC', 'Barcelona']

      - name: source_country
        tests:
          - not_null

      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['nyc_311', 'barcelona_iris']

      - name: area_name
        tests:
          - not_null

      - name: has_area
        tests:
          - not_null

      - name: total_requests
        tests:
          - not_null

      - name: closed_requests
        tests:
          - not_null

      - name: open_requests
        tests:
          - not_null

      - name: open_backlog_rate_pct
        tests:
          - not_null

      - name: geocoded_rate_pct
        tests:
          - not_null

  - name: mart_request_map_points
    description: "Request-level geospatial mart for Superset maps, filtered to records with valid latitude and longitude."
    columns:
      - name: map_point_id
        tests:
          - not_null
          - unique

      - name: service_request_key
        tests:
          - not_null
          - unique

      - name: source_city
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NYC', 'Barcelona']

      - name: source_country
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USA', 'Spain']

      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['nyc_311', 'barcelona_iris']

      - name: request_id
        tests:
          - not_null

      - name: created_at
        tests:
          - not_null

      - name: service_category_standardized
        tests:
          - not_null

      - name: area_name
        tests:
          - not_null

      - name: latitude
        tests:
          - not_null

      - name: longitude
        tests:
          - not_null

      - name: has_geo
        tests:
          - not_null

      - name: resolution_time_bucket
        tests:
          - not_null

      - name: sla_72h_proxy_status
        tests:
          - not_null

  - name: mart_data_coverage_diagnostics
    description: "City-level data coverage diagnostics for evaluating observation windows, geospatial usability, category coverage, and whether cross-city temporal comparisons have a valid common window."
    columns:
      - name: source_city
        description: "Canonical city name for the source dataset."
        tests:
          - not_null

      - name: source_country
        description: "Country associated with the source city."
        tests:
          - not_null

      - name: source_system
        description: "Source system providing the service request records."
        tests:
          - not_null

      - name: first_request_date
        description: "Earliest request creation date available for the city/source."
        tests:
          - not_null

      - name: last_request_date
        description: "Latest request creation date available for the city/source."
        tests:
          - not_null

      - name: available_days
        description: "Number of calendar days between the first and last available request dates, inclusive."
        tests:
          - not_null

      - name: available_years
        description: "Approximate available observation period in years."
        tests:
          - not_null

      - name: record_count
        description: "Total number of service request records available for the city/source."
        tests:
          - not_null

      - name: records_with_geo
        description: "Number of records flagged as having geospatial information."
        tests:
          - not_null

      - name: records_missing_geo
        description: "Number of records missing usable geospatial information."
        tests:
          - not_null

      - name: usable_geospatial_share_pct
        description: "Percentage of records flagged as having geospatial information."
        tests:
          - not_null

      - name: missing_geospatial_share_pct
        description: "Percentage of records missing usable geospatial information."
        tests:
          - not_null

      - name: records_with_valid_lat_lon
        description: "Number of records with non-null latitude and longitude values inside valid coordinate ranges."
        tests:
          - not_null

      - name: valid_lat_lon_share_pct
        description: "Percentage of records with valid latitude and longitude values."
        tests:
          - not_null

      - name: distinct_service_categories
        description: "Number of standardized service categories represented in the city/source data."
        tests:
          - not_null

      - name: open_record_count
        description: "Number of records classified as open."
        tests:
          - not_null

      - name: closed_record_count
        description: "Number of records classified as closed."
        tests:
          - not_null

      - name: common_window_start
        description: "Start date of the common observation window across all included cities, calculated as the latest city-level first request date."
        tests:
          - not_null

      - name: common_window_end
        description: "End date of the common observation window across all included cities, calculated as the earliest city-level last request date."
        tests:
          - not_null

      - name: has_valid_common_window
        description: "Boolean flag indicating whether the common observation window is valid. False means the common window start is after the common window end."
        tests:
          - not_null

      - name: common_window_days
        description: "Number of days in the common observation window. Zero when no valid common window exists."
        tests:
          - not_null

      - name: inside_common_window_record_count
        description: "Number of records from the city/source falling inside the valid common observation window."
        tests:
          - not_null

      - name: inside_common_window_share_pct
        description: "Percentage of city/source records falling inside the valid common observation window."
        tests:
          - not_null

      - name: coverage_diagnostic_note
        description: "Human-readable diagnostic note explaining whether the data supports cross-city temporal comparison and geospatial analysis."
        tests:
          - not_null
